services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./receiver/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - internal

  receiver:
    build: ./receiver
    restart: unless-stopped
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TELEMETRY_JWT_SECRET: ${TELEMETRY_JWT_SECRET}
      TELEMETRY_JWT_ALGORITHM: ${TELEMETRY_JWT_ALGORITHM}
      INGEST_QUEUE_SIZE: ${INGEST_QUEUE_SIZE}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
      - traefik-public
    labels:
      # /api/v1/* → receiver (приоритет 100, перехватывает раньше Metabase).
      - traefik.enable=true
      - traefik.constraint-label=traefik-public
      - traefik.docker.network=traefik-public
      # HTTP → редирект на HTTPS (использует глобальный middleware https-redirect).
      - traefik.http.routers.receiver-http.entrypoints=http
      - traefik.http.routers.receiver-http.rule=Host(`${ANALYTICS_DOMAIN}`) && PathPrefix(`/api/v1`)
      - traefik.http.routers.receiver-http.middlewares=https-redirect
      - traefik.http.routers.receiver-http.priority=100
      # HTTPS — сам приёмник.
      - traefik.http.routers.receiver-https.entrypoints=https
      - traefik.http.routers.receiver-https.rule=Host(`${ANALYTICS_DOMAIN}`) && PathPrefix(`/api/v1`)
      - traefik.http.routers.receiver-https.tls=true
      - traefik.http.routers.receiver-https.tls.certresolver=le
      - traefik.http.routers.receiver-https.priority=100
      - traefik.http.services.receiver.loadbalancer.server.port=8000

  metabase:
    image: metabase/metabase:latest
    restart: unless-stopped
    environment:
      MB_DB_TYPE: ${MB_DB_TYPE}
      MB_DB_HOST: ${MB_DB_HOST}
      MB_DB_PORT: ${MB_DB_PORT}
      MB_DB_DBNAME: ${MB_DB_DBNAME}
      MB_DB_USER: ${MB_DB_USER}
      MB_DB_PASS: ${MB_DB_PASS}
      MB_SITE_URL: https://${ANALYTICS_DOMAIN}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - metabase_data:/metabase-data
    networks:
      - internal
      - traefik-public
    labels:
      # Корень и всё, что не /api/v1 → Metabase (priority=10).
      - traefik.enable=true
      - traefik.constraint-label=traefik-public
      - traefik.docker.network=traefik-public
      - traefik.http.routers.metabase-http.entrypoints=http
      - traefik.http.routers.metabase-http.rule=Host(`${ANALYTICS_DOMAIN}`)
      - traefik.http.routers.metabase-http.middlewares=https-redirect
      - traefik.http.routers.metabase-http.priority=10
      - traefik.http.routers.metabase-https.entrypoints=https
      - traefik.http.routers.metabase-https.rule=Host(`${ANALYTICS_DOMAIN}`)
      - traefik.http.routers.metabase-https.tls=true
      - traefik.http.routers.metabase-https.tls.certresolver=le
      - traefik.http.routers.metabase-https.priority=10
      - traefik.http.services.metabase.loadbalancer.server.port=3000

volumes:
  postgres_data:
  metabase_data:

networks:
  internal:
  traefik-public:
    external: true
