services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./receiver/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - internal

  receiver:
    build: ./receiver
    restart: unless-stopped
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TELEMETRY_JWT_SECRET: ${TELEMETRY_JWT_SECRET}
      TELEMETRY_JWT_ALGORITHM: ${TELEMETRY_JWT_ALGORITHM}
      INGEST_QUEUE_SIZE: ${INGEST_QUEUE_SIZE}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
      - traefik-public
    labels:
      # /api/v1/* → receiver (приоритет выше, перехватывает раньше Metabase).
      # Metabase свои внутренние эндпоинты держит на /api/<entity> без /v1,
      # так что префикс /api/v1 не конфликтует.
      - traefik.enable=true
      - traefik.docker.network=traefik-public
      - traefik.http.routers.receiver.rule=Host(`${ANALYTICS_DOMAIN}`) && PathPrefix(`/api/v1`)
      - traefik.http.routers.receiver.entrypoints=websecure
      - traefik.http.routers.receiver.tls.certresolver=le
      - traefik.http.routers.receiver.priority=100
      - traefik.http.services.receiver.loadbalancer.server.port=8000

  metabase:
    image: metabase/metabase:latest
    restart: unless-stopped
    environment:
      MB_DB_TYPE: ${MB_DB_TYPE}
      MB_DB_HOST: ${MB_DB_HOST}
      MB_DB_PORT: ${MB_DB_PORT}
      MB_DB_DBNAME: ${MB_DB_DBNAME}
      MB_DB_USER: ${MB_DB_USER}
      MB_DB_PASS: ${MB_DB_PASS}
      # Metabase сам генерирует ссылки и редиректы — нужно сказать, что мы
      # за reverse proxy на HTTPS, иначе сломаются auth-редиректы.
      MB_SITE_URL: https://${ANALYTICS_DOMAIN}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - metabase_data:/metabase-data
    networks:
      - internal
      - traefik-public
    labels:
      # Корень и всё остальное (кроме /api/v1) → Metabase.
      - traefik.enable=true
      - traefik.docker.network=traefik-public
      - traefik.http.routers.metabase.rule=Host(`${ANALYTICS_DOMAIN}`)
      - traefik.http.routers.metabase.entrypoints=websecure
      - traefik.http.routers.metabase.tls.certresolver=le
      - traefik.http.routers.metabase.priority=10
      - traefik.http.services.metabase.loadbalancer.server.port=3000

volumes:
  postgres_data:
  metabase_data:

networks:
  internal:
  # Внешняя сеть существующего Traefik (создана отдельно, не нами).
  traefik-public:
    external: true
