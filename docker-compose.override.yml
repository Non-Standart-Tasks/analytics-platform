# Локальный оверрайд: без Traefik/HTTPS, всё на localhost.
# docker compose автоматически мержит этот файл с docker-compose.yml.

services:
  # На локалке Traefik не нужен — отключаем.
  traefik:
    profiles: ["disabled"]

  postgres:
    ports:
      - "5433:5432"   # 5432 уже занят основным проектом

  receiver:
    ports:
      - "8100:8000"
    labels: !reset []

  metabase:
    ports:
      - "3000:3000"
    labels: !reset []
