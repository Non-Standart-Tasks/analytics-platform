services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./receiver/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - internal

  receiver:
    build: ./receiver
    restart: unless-stopped
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TELEMETRY_JWT_SECRET: ${TELEMETRY_JWT_SECRET}
      TELEMETRY_JWT_ALGORITHM: ${TELEMETRY_JWT_ALGORITHM}
      INGEST_QUEUE_SIZE: ${INGEST_QUEUE_SIZE}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
      - traefik-public
    labels:
      # /api/v1/* → receiver (приоритет 100, перехватывает раньше Metabase).
      - traefik.enable=true
      - traefik.constraint-label=traefik-public
      - traefik.docker.network=traefik-public
      # HTTP → редирект на HTTPS (использует глобальный middleware https-redirect).
      - traefik.http.routers.receiver-http.entrypoints=http
      - traefik.http.routers.receiver-http.rule=Host(`${ANALYTICS_DOMAIN}`) && PathPrefix(`/api/v1`)
      - traefik.http.routers.receiver-http.middlewares=https-redirect
      - traefik.http.routers.receiver-http.priority=100
      # HTTPS — сам приёмник.
      - traefik.http.routers.receiver-https.entrypoints=https
      - traefik.http.routers.receiver-https.rule=Host(`${ANALYTICS_DOMAIN}`) && PathPrefix(`/api/v1`)
      - traefik.http.routers.receiver-https.tls=true
      - traefik.http.routers.receiver-https.tls.certresolver=le
      - traefik.http.routers.receiver-https.priority=100
      - traefik.http.services.receiver.loadbalancer.server.port=8000

  grafana:
    image: grafana/grafana-oss:latest
    restart: unless-stopped
    environment:
      # Админ создаётся при первом старте; пароль из .env.
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL: https://${ANALYTICS_DOMAIN}
      # Datasource провижится из ./grafana/provisioning/datasources/analytics.yml
      # — Grafana подставит эти env-переменные в шаблон.
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      # Дашборды-as-code (см. grafana/dashboards/*.json).
      # Provider config grafana/provisioning/dashboards/provider.yml сканит эту папку.
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - internal
      - traefik-public
    labels:
      # Корень и всё, что не /api/v1 → Grafana (priority=10).
      - traefik.enable=true
      - traefik.constraint-label=traefik-public
      - traefik.docker.network=traefik-public
      - traefik.http.routers.grafana-http.entrypoints=http
      - traefik.http.routers.grafana-http.rule=Host(`${ANALYTICS_DOMAIN}`)
      - traefik.http.routers.grafana-http.middlewares=https-redirect
      - traefik.http.routers.grafana-http.priority=10
      - traefik.http.routers.grafana-https.entrypoints=https
      - traefik.http.routers.grafana-https.rule=Host(`${ANALYTICS_DOMAIN}`)
      - traefik.http.routers.grafana-https.tls=true
      - traefik.http.routers.grafana-https.tls.certresolver=le
      - traefik.http.routers.grafana-https.priority=10
      - traefik.http.services.grafana.loadbalancer.server.port=3000

volumes:
  postgres_data:
  grafana_data:

networks:
  internal:
  traefik-public:
    external: true
